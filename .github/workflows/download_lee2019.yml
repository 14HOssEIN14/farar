name: Download, Split, and Push to Main

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: 'Direct URL of the file to download'
        required: true
        type: string

jobs:
  split-and-push:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write  # Explicitly grant write permissions
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}  # Use PAT if available
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: pip install requests
    
    - name: Download and split file
      env:
        FILE_URL: ${{ github.event.inputs.file_url }}
      run: |
        python split_file.py
    
    - name: Configure Git
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
    
    - name: Commit and push to main
      run: |
        TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
        
        # Pull latest changes first
        git pull origin main --rebase || true
        
        # Create timestamped folder
        mkdir -p "archived_chunks/$TIMESTAMP"
        mv chunks/* "archived_chunks/$TIMESTAMP/" 2>/dev/null || true
        
        git add archived_chunks/
        git commit -m "Add file chunks from ${{ github.event.inputs.file_url }} (${TIMESTAMP})" || echo "No changes to commit"
        git push origin main
      env:
        GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
