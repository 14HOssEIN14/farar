name: Download, Split, and Push to Main

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: 'Direct URL of the file to download'
        required: true
        type: string

jobs:
  split-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: pip install requests
    
    - name: Download and split file
      env:
        FILE_URL: ${{ github.event.inputs.file_url }}
      run: |
        python split_file.py
    
    - name: Commit and push to main
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        
        # Create a timestamped folder to avoid conflicts
        TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
        mkdir -p "archived_chunks/$TIMESTAMP"
        mv chunks/* "archived_chunks/$TIMESTAMP/"
        
        git add archived_chunks/
        git commit -m "Add file chunks from ${{ github.event.inputs.file_url }} (${TIMESTAMP})"
        git push origin main
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
