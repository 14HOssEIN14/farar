name: Download Lee2019 MI and Push to Repo

on:
  workflow_dispatch:

jobs:
  download-and-split:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install moabb mne numpy
    
    - name: Download and split dataset
      run: python download.py
    
    - name: Commit and push chunks
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add Lee2019_MI_splits/
        git commit -m "Add Lee2019_MI dataset chunks" || echo "No changes"
        git push
