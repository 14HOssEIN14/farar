name: Download and Push Lee2019_MI Dataset

on:
  workflow_dispatch:

jobs:
  download-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install moabb mne
    
    - name: Download Lee2019_MI dataset
      run: python download_and_push.py
    
    - name: Commit and push dataset to repo
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add Lee2019_MI_data/
        git commit -m "Add Lee2019_MI dataset" || echo "No changes to commit"
        git push
