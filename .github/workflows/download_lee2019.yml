name: Download Lee2019_MI Dataset

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install moabb mne

      - name: Download Lee2019_MI dataset
        run: |
          import os
          from moabb.datasets import Lee2019_MI
          os.environ['MNE_DATA'] = os.path.join(os.getcwd(), 'lee2019_mi_data')
          print('Downloading Lee2019_MI dataset...')
          dataset = Lee2019_MI()
          dataset.download()
          print('Download complete!')

      - name: Commit and push to repository
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add lee2019_mi_data/
          git commit -m "Add Lee2019_MI dataset" || echo "Nothing to commit"
          git push
