name: دریافت لینک مستقیم یوتیوب (تضمینی)

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'لینک ویدیوی یوتیوب'
        required: true
        default: 'https://youtu.be/dQw4w9WgXcQ'
      quality:
        description: 'کیفیت (480 یا 720)'
        required: true
        default: '720'

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: نصب yt-dlp
        run: |
          pip install --upgrade yt-dlp
          pip instaall moabb
      - name: دریافت لینک مستقیم
        id: getlink
        run: |
          VIDEO_URL="${{ inputs.video_url }}"
          QUALITY="${{ inputs.quality }}"
          
          echo "🔍 در حال پردازش: $VIDEO_URL"
          echo "🎯 کیفیت درخواستی: ${QUALITY}p"
          echo ""
          
          # روش اول: تلاش با فرمت ساده
          LINK=$(yt-dlp --no-check-certificate \
                        --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
                        --extractor-args "youtube:skip=webpage,player_client=android" \
                        -f "best[height<=$QUALITY]" \
                        -g "$VIDEO_URL" 2>/dev/null | head -1)
          
          if [ -z "$LINK" ]; then
            echo "🔄 روش دوم را امتحان می‌کنم..."
            # روش دوم: تفکیک ویدیو و صدا
            LINK=$(yt-dlp --no-check-certificate \
                          --user-agent "Mozilla/5.0" \
                          -f "bestvideo[height<=$QUALITY]+bestaudio/best" \
                          -g "$VIDEO_URL" 2>/dev/null | head -1)
          fi
          
          if [ -n "$LINK" ]; then
            echo "✅ لینک دریافت شد!"
            echo "LINK=$LINK" >> $GITHUB_OUTPUT
            echo "$LINK" > direct_link.txt
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "$LINK"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          else
            echo "❌ دریافت لینک مقدور نیست. ویدیو احتمالاً خصوصی یا نیاز به احراز هویت دارد."
            echo "LINK=ERROR" >> $GITHUB_OUTPUT
            echo "خطا" > direct_link.txt
          fi
      
      - name: آپلود خروجی
        uses: actions/upload-artifact@v4
        with:
          name: لینک-ویدیو
          path: direct_link.txt
          retention-days: 7
      
      - name: نمایش لینک در لاگ
        if: steps.getlink.outputs.LINK != 'ERROR'
        run: |
          echo "::notice title=لینک دانلود مستقیم::${{ steps.getlink.outputs.LINK }}"
