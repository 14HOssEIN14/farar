name: Get YouTube Direct Link

on:
  workflow_dispatch:  # این یعنی فقط وقتی خودت دستی اجراش کنی کار می‌کنه
    inputs:
      video_url:
        description: 'لینک یوتیوب'
        required: true
        default: 'https://youtu.be/lXlc1IWHX6Q'
      quality:
        description: 'کیفیت (480 یا 720)'
        required: true
        default: '720'

jobs:
  fetch-link:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install yt-dlp
      run: |
        pip install yt-dlp
    
    - name: Get direct link
      run: |
        python get_link.py
      env:
        VIDEO_URL: ${{ github.event.inputs.video_url }}
        QUALITY: ${{ github.event.inputs.quality }}
    
    - name: Save link to file
      run: |
        python get_link.py > result.txt
    
    - name: Upload result
      uses: actions/upload-artifact@v4
      with:
        name: video-link
        path: result.txt
