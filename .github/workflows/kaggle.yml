name: Download, Re-zip, Split, and Push

on:
  workflow_dispatch:

jobs:
  process-and-push:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: pip install kagglehub
    
    - name: Download and re-zip
      run: |
        import kagglehub
        import os
        import zipfile
        
        # Download (auto-extracts)
        print("Downloading dataset...")
        path = kagglehub.dataset_download("mohammadaminorojloo/persian-twitter-tweets-20m")
        print(f"Extracted files at: {path}")
        
        # List extracted files
        files = os.listdir(path)
        print(f"\nExtracted {len(files)} files:")
        total_size = 0
        for f in files:
            size = os.path.getsize(os.path.join(path, f)) / 1024 / 1024
            total_size += size
            print(f"  {f}: {size:.2f} MB")
        print(f"Total extracted size: {total_size:.2f} MB")
        
        # Zip ALL extracted files into ONE zip
        print("\nCreating single zip archive...")
        zip_path = 'persian_twitter_dataset.zip'
        with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED) as zipf:
            for file in files:
                file_path = os.path.join(path, file)
                zipf.write(file_path, file)
                print(f"  Added: {file}")
        
        zip_size = os.path.getsize(zip_path) / 1024 / 1024
        print(f"\n✅ Created zip: {zip_path} ({zip_size:.2f} MB)")
        
      shell: python
    
    - name: Split zip into 50MB parts
      run: |
        import os
        import subprocess
        
        # Split the zip file
        print("Splitting zip into 50MB chunks...")
        subprocess.run([
            'split',
            '-b', '50M',
            '-d',
            '--additional-suffix=.zip',
            'persian_twitter_dataset.zip',
            'dataset_part_'
        ], check=True)
        
        # Rename parts nicely
        os.makedirs('chunks', exist_ok=True)
        parts = sorted([f for f in os.listdir('.') if f.startswith('dataset_part_') and f.endswith('.zip')])
        
        for i, part in enumerate(parts, 1):
            old = part
            new = f"chunks/persian_twitter_dataset.zip.part{i:03d}"
            os.rename(old, new)
            size = os.path.getsize(new) / 1024 / 1024
            print(f"  → {new} ({size:.2f} MB)")
        
        print(f"\n✅ Created {len(parts)} chunks")
        
        # Save reconstruction info
        with open('chunks/RECONSTRUCT.txt', 'w') as f:
            f.write("To reconstruct the original dataset:\n\n")
            f.write("1. Download all .part files\n")
            f.write("2. Run this command:\n")
            f.write("   cat persian_twitter_dataset.zip.part* > persian_twitter_dataset.zip\n")
            f.write("3. Unzip the file:\n")
            f.write("   unzip persian_twitter_dataset.zip\n")
        
      shell: python
    
    - name: Configure Git
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
    
    - name: Commit and push
      run: |
        TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
        
        git pull origin main --rebase || true
        
        mkdir -p "dataset_archive/$TIMESTAMP"
        mv chunks/* "dataset_archive/$TIMESTAMP/"
        
        git add dataset_archive/
        git commit -m "Add dataset zip split into 50MB parts - ${TIMESTAMP}" || echo "No changes"
        git push origin main
        
      env:
        GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
