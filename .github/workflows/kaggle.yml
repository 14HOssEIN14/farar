name: Upload to Google Drive

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        lfs: true
    
    - name: Install gdrive
      run: |
        wget https://github.com/prasmussen/gdrive/releases/download/2.1.1/gdrive_2.1.1_linux_amd64.tar.gz
        tar -xzf gdrive_2.1.1_linux_amd64.tar.gz
        sudo mv gdrive /usr/local/bin/
    
    - name: Upload
      env:
        GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
      run: |
        mkdir -p ~/.config/gdrive
        echo "$GDRIVE_TOKEN" > ~/.config/gdrive/token.json
        cd dataset_archive/20260509_101621
        for f in *.part*; do
          gdrive upload --parent 1p3kb1H0sEz_DAnZIA0k4N4M3RC0ZaIVh "$f"
        done
