name: Download Exact 700MB Dataset

on:
  workflow_dispatch:

jobs:
  download-and-split:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install kagglehub pandas
      
      - name: Download and split exact size
        run: |
          import kagglehub
          import pandas as pd
          import os
          import zipfile
          
          print("📥 Downloading full dataset...")
          path = kagglehub.dataset_download("mohammadaminorojloo/persian-twitter-tweets-20m")
          
          print("🔍 Finding CSV file...")
          csv_file = None
          for root, dirs, files in os.walk(path):
              for file in files:
                  if file.endswith('.csv'):
                      csv_file = os.path.join(root, file)
                      break
              if csv_file:
                  break
          
          # روش درست: خوندن تکه تکه تا برسیم به 700 مگ
          os.makedirs('data/raw', exist_ok=True)
          output_csv = 'data/raw/sample_700mb.csv'
          
          print("📖 Reading chunks until 700MB...")
          chunk_size = 50000
          total_rows = 0
          target_bytes = 700 * 1024 * 1024  # 700MB
          current_bytes = 0
          
          first_chunk = True
          with open(output_csv, 'w', encoding='utf-8') as outfile:
              for chunk in pd.read_csv(csv_file, chunksize=chunk_size):
                  # نوشتن header فقط برای چانک اول
                  if first_chunk:
                      chunk.to_csv(outfile, index=False, encoding='utf-8')
                      first_chunk = False
                  else:
                      chunk.to_csv(outfile, index=False, encoding='utf-8', header=False)
                  
                  total_rows += len(chunk)
                  current_bytes = os.path.getsize(output_csv)
                  
                  print(f"   Rows: {total_rows:,} | Size: {current_bytes/(1024*1024):.1f} MB")
                  
                  if current_bytes >= target_bytes:
                      print(f"✅ Reached target at {current_bytes/(1024*1024):.1f} MB")
                      break
          
          print(f"\n📊 Final: {total_rows:,} rows, {current_bytes/(1024*1024):.1f} MB")
          
          # ZIP کردن
          print("🗜️ Creating ZIP...")
          zip_path = 'data/raw/sample_700mb.zip'
          with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED) as zipf:
              zipf.write(output_csv, arcname='sample_700mb.csv')
          
          zip_size = os.path.getsize(zip_path)
          zip_size_mb = zip_size / (1024 * 1024)
          print(f"🗜️ ZIP size: {zip_size_mb:.2f} MB")
          
          # پارت کردن 50 مگی
          print("✂️ Splitting into 50MB parts...")
          os.makedirs('data/raw/parts', exist_ok=True)
          
          part_num = 1
          with open(zip_path, 'rb') as f:
              while True:
                  chunk = f.read(50 * 1024 * 1024)
                  if not chunk:
                      break
                  part_path = f'data/raw/parts/sample_700mb.zip.part{part_num:03d}'
                  with open(part_path, 'wb') as part_file:
                      part_file.write(chunk)
                  print(f"✅ Part {part_num:03d}: {len(chunk)/(1024*1024):.2f} MB")
                  part_num += 1
          
          print(f"\n🎉 Done! {part_num-1} parts created")
          
          # پاک کردن فایل‌های موقت
          os.remove(output_csv)
          os.remove(zip_path)
          
          # متادیتا
          with open('data/raw/parts/info.txt', 'w') as f:
              f.write(f"Target size: 700 MB\n")
              f.write(f"Actual size: {current_bytes/(1024*1024):.2f} MB\n")
              f.write(f"ZIP size: {zip_size_mb:.2f} MB\n")
              f.write(f"Number of rows: {total_rows:,}\n")
              f.write(f"Number of parts: {part_num-1}\n")
          
        shell: python
      
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/parts/
          git commit -m "Add exact 700MB dataset parts" || echo "No changes"
          git push
