name: Download Persian Twitter Dataset and Split

on:
  workflow_dispatch:
    inputs:
      rows_to_download:
        description: 'Number of rows to download (approx 2M rows = 700MB)'
        required: false
        default: '2000000'
        type: string

jobs:
  download-split-push:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install kagglehub pandas
    
    - name: Download first N rows from dataset
      env:
        N_ROWS: ${{ github.event.inputs.rows_to_download }}
      run: |
        import kagglehub
        import pandas as pd
        import os
        
        # Download dataset
        print("Downloading dataset from Kaggle...")
        path = kagglehub.dataset_download("mohammadaminorojloo/persian-twitter-tweets-20m")
        print(f"Dataset downloaded to: {path}")
        
        # Find the main data file (assuming .csv or .parquet)
        files = os.listdir(path)
        data_file = None
        for file in files:
            if file.endswith(('.csv', '.parquet', '.json')):
                data_file = os.path.join(path, file)
                break
        
        if not data_file:
            raise Exception("No data file found in downloaded dataset")
        
        print(f"Reading data from: {data_file}")
        
        # Read only first N rows
        if data_file.endswith('.csv'):
            df = pd.read_csv(data_file, nrows=int(os.environ['N_ROWS']))
        elif data_file.endswith('.parquet'):
            df = pd.read_parquet(data_file)
            df = df.head(int(os.environ['N_ROWS']))
        else:
            df = pd.read_json(data_file, lines=True)
            df = df.head(int(os.environ['N_ROWS']))
        
        # Save subset
        output_file = 'persian_tweets_subset.csv'
        df.to_csv(output_file, index=False)
        
        print(f"Saved {len(df)} rows to {output_file}")
        print(f"File size: {os.path.getsize(output_file) / 1024 / 1024:.2f} MB")
        
      shell: python
    
    - name: Split into 50MB chunks
      run: |
        import os
        import math
        
        # Create chunks directory
        os.makedirs('chunks', exist_ok=True)
        
        input_file = 'persian_tweets_subset.csv'
        chunk_size_mb = 50
        chunk_size_bytes = chunk_size_mb * 1024 * 1024
        
        # Get file size
        file_size = os.path.getsize(input_file)
        num_chunks = math.ceil(file_size / chunk_size_bytes)
        
        print(f"Splitting {file_size / 1024 / 1024:.2f}MB into {num_chunks} chunks of ~{chunk_size_mb}MB each")
        
        # Split using command line for better performance
        import subprocess
        subprocess.run([
            'split', 
            '-b', str(chunk_size_bytes), 
            '-d', 
            '--additional-suffix=.csv',
            input_file, 
            'chunks/persian_tweets_part_'
        ], check=True)
        
        # Rename chunks to have proper numbering
        chunks = sorted(os.listdir('chunks'))
        for i, chunk in enumerate(chunks):
            old_path = os.path.join('chunks', chunk)
            new_path = os.path.join('chunks', f'persian_tweets_part_{i+1:03d}.csv')
            os.rename(old_path, new_path)
            print(f"Created: {new_path} ({os.path.getsize(new_path) / 1024 / 1024:.2f}MB)")
        
      shell: python
    
    - name: Create archive manifest
      run: |
        cat > chunks/README.md << EOF
        # Persian Twitter Dataset Chunks
        
        This dataset contains ${{ github.event.inputs.rows_to_download }} rows from the 
        [Persian Twitter Tweets 20M](https://www.kaggle.com/datasets/mohammadaminorojloo/persian-twitter-tweets-20m) dataset.
        
        - Original file was split into 50MB chunks
        - Total chunks: $(ls -1 chunks/persian_tweets_part_*.csv | wc -l)
        - Download date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
        
        ## Reconstruct the original file
        
        To combine these chunks back into the original CSV file:
        
        \`\`\`bash
        cat chunks/persian_tweets_part_*.csv > persian_tweets_subset.csv
        \`\`\`
        
        Or using Python:
        
        \`\`\`python
        import pandas as pd
        import glob
        
        chunks = glob.glob('chunks/persian_tweets_part_*.csv')
        df = pd.concat([pd.read_csv(chunk) for chunk in sorted(chunks)])
        df.to_csv('persian_tweets_subset.csv', index=False)
        \`\`\`
        EOF
        
    - name: Configure Git
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
    
    - name: Commit and push to main
      run: |
        TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
        
        # Pull latest changes
        git pull origin main --rebase || true
        
        # Create timestamped folder to avoid conflicts
        mkdir -p "dataset_chunks/$TIMESTAMP"
        mv chunks/* "dataset_chunks/$TIMESTAMP/"
        
        # Update latest symlink (create if doesn't exist, or update)
        ln -snf "$TIMESTAMP" dataset_chunks/latest
        
        git add dataset_chunks/
        git commit -m "Add Persian Twitter dataset subset (${{ github.event.inputs.rows_to_download }} rows, split into 50MB chunks) - ${TIMESTAMP}" || echo "No changes to commit"
        git push origin main
        
      env:
        GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
