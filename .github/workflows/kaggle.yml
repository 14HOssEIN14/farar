name: Download and Split Raw Files

on:
  workflow_dispatch:

jobs:
  split-and-push:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: pip install kagglehub
    
    - name: Download and split raw files
      run: |
        import kagglehub
        import os
        import subprocess
        
        # Download dataset (this downloads the compressed/raw files)
        print("Downloading...")
        path = kagglehub.dataset_download("mohammadaminorojloo/persian-twitter-tweets-20m")
        print(f"Downloaded to: {path}")
        
        # List what we got
        files = os.listdir(path)
        print(f"\nRaw files downloaded ({len(files)} files):")
        for f in files:
            size = os.path.getsize(os.path.join(path, f)) / 1024 / 1024
            print(f"  {f}: {size:.2f} MB")
        
        # Create chunks directory
        os.makedirs('chunks', exist_ok=True)
        
        # Split each raw file into 50MB chunks (no extraction!)
        chunk_id = 1
        for raw_file in files:
            raw_path = os.path.join(path, raw_file)
            file_size = os.path.getsize(raw_path)
            
            print(f"\nSplitting: {raw_file} ({file_size / 1024 / 1024:.2f} MB)")
            
            # Split the raw file into 50MB parts
            subprocess.run([
                'split',
                '-b', '50M',
                '-d',
                '--additional-suffix=.raw',
                raw_path,
                f'chunks/{raw_file}_part_'
            ], check=True)
            
            # Rename parts with proper numbering
            parts = sorted([f for f in os.listdir('chunks') if f.startswith(f'{raw_file}_part_')])
            for i, part in enumerate(parts, 1):
                old = os.path.join('chunks', part)
                new = os.path.join('chunks', f'{raw_file}.part{i:03d}')
                os.rename(old, new)
                print(f"  → {new} ({os.path.getsize(new) / 1024 / 1024:.2f} MB)")
            
            chunk_id += 1
        
        # Save manifest
        with open('chunks/MANIFEST.txt', 'w') as f:
            f.write("To reconstruct:\n")
            f.write("cat *.part* > original_file\n")
            for raw_file in files:
                f.write(f"\n{raw_file}:\n")
                f.write(f"  cat {raw_file}.part* > {raw_file}\n")
        
        print(f"\n✅ Split {len(files)} raw files into {len(os.listdir('chunks'))-1} chunks")
        
      shell: python
    
    - name: Configure Git
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
    
    - name: Commit and push
      run: |
        TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
        
        git pull origin main --rebase || true
        
        mkdir -p "dataset_parts/$TIMESTAMP"
        mv chunks/* "dataset_parts/$TIMESTAMP/"
        
        git add dataset_parts/
        git commit -m "Add raw dataset parts (50MB chunks) - ${TIMESTAMP}" || echo "No changes"
        git push origin main
        
      env:
        GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
