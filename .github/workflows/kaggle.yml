name: Download Persian Twitter Dataset and Split

on:
  workflow_dispatch:
    inputs:
      rows_to_download:
        description: 'Number of rows to download (approx 2M rows = 700MB)'
        required: false
        default: '2000000'
        type: string

jobs:
  download-split-push:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install kagglehub pandas pyarrow
    
    - name: Download dataset and create chunks
      env:
        N_ROWS: ${{ github.event.inputs.rows_to_download }}
      run: |
        import kagglehub
        import pandas as pd
        import os
        import glob
        import json
        import subprocess
        import math
        from datetime import datetime
        
        print("=" * 50)
        print("Step 1: Downloading dataset from Kaggle...")
        print("=" * 50)
        
        path = kagglehub.dataset_download("mohammadaminorojloo/persian-twitter-tweets-20m")
        print(f"Dataset downloaded to: {path}")
        
        # Find Parquet files
        parquet_files = glob.glob(os.path.join(path, "*.parquet"))
        
        if not parquet_files:
            raise Exception("No parquet files found in downloaded dataset")
        
        print(f"Found parquet files: {parquet_files}")
        
        # Read first parquet file
        data_file = parquet_files[0]
        print(f"Reading data from: {data_file}")
        
        # Get total rows without loading entire file
        import pyarrow.parquet as pq
        parquet_file = pq.ParquetFile(data_file)
        total_rows = parquet_file.metadata.num_rows
        print(f"Total rows in file: {total_rows:,}")
        
        # Calculate rows to read
        n_rows = int(os.environ['N_ROWS'])
        rows_to_read = min(n_rows, total_rows)
        print(f"Reading {rows_to_read:,} rows ({rows_to_read/total_rows*100:.1f}% of file)")
        
        # Read only the first N rows in chunks to manage memory
        chunk_size = 100000  # 100k rows per chunk
        chunks = []
        rows_read = 0
        
        print("\nLoading data in chunks...")
        for batch in parquet_file.iter_batches(batch_size=chunk_size):
            if rows_read >= rows_to_read:
                break
            chunk = batch.to_pandas()
            chunks.append(chunk)
            rows_read += len(chunk)
            print(f"  Loaded {rows_read:,} rows...")
        
        # Combine chunks
        df = pd.concat(chunks, ignore_index=True) if chunks else pd.DataFrame()
        
        # Trim if we overshot
        if len(df) > rows_to_read:
            df = df.head(rows_to_read)
        
        print(f"\n✅ Successfully loaded {len(df):,} rows")
        
        # Save to CSV
        output_file = 'persian_tweets_subset.csv'
        df.to_csv(output_file, index=False)
        
        file_size_mb = os.path.getsize(output_file) / 1024 / 1024
        print(f"\n📁 Saved to {output_file}")
        print(f"📊 File size: {file_size_mb:.2f} MB")
        print(f"📋 Shape: {df.shape}")
        print(f"📝 Columns: {list(df.columns)}")
        
        # Show sample
        print("\n📄 Sample data:")
        print(df.head(2))
        
        print("\n" + "=" * 50)
        print("Step 2: Splitting into 50MB chunks...")
        print("=" * 50)
        
        # Create chunks directory
        os.makedirs('chunks', exist_ok=True)
        
        chunk_size_mb = 50
        chunk_size_bytes = chunk_size_mb * 1024 * 1024
        
        # Get file size
        file_size = os.path.getsize(output_file)
        file_size_mb = file_size / 1024 / 1024
        num_chunks = math.ceil(file_size / chunk_size_bytes)
        
        print(f"Input file: {output_file}")
        print(f"File size: {file_size_mb:.2f} MB")
        print(f"Splitting into {num_chunks} chunks of ~{chunk_size_mb} MB each")
        
        # Split the file
        subprocess.run([
            'split', 
            '-b', str(chunk_size_bytes), 
            '-d', 
            '--additional-suffix=.csv',
            output_file, 
            'chunks/persian_tweets_part_'
        ], check=True)
        
        # Rename chunks for better sorting
        chunk_files = sorted([f for f in os.listdir('chunks') if f.endswith('.csv')])
        for i, chunk in enumerate(chunk_files):
            old_path = os.path.join('chunks', chunk)
            new_path = os.path.join('chunks', f'persian_tweets_part_{i+1:03d}.csv')
            os.rename(old_path, new_path)
            chunk_size_mb_actual = os.path.getsize(new_path) / 1024 / 1024
            print(f"  Part {i+1:03d}: {chunk_size_mb_actual:.2f} MB")
        
        total_chunks = len(chunk_files)
        print(f"\n✅ Successfully created {total_chunks} chunks in 'chunks/' directory")
        
        print("\n" + "=" * 50)
        print("Step 3: Creating metadata and documentation...")
        print("=" * 50)
        
        # Create metadata
        metadata = {
            "dataset_name": "Persian Twitter Tweets",
            "source": "https://www.kaggle.com/datasets/mohammadaminorojloo/persian-twitter-tweets-20m",
            "rows_downloaded": rows_to_read,
            "download_date": datetime.utcnow().isoformat(),
            "original_format": "parquet",
            "converted_format": "csv",
            "total_chunks": total_chunks,
            "chunk_size_mb": 50,
            "original_file_size_mb": round(file_size_mb, 2),
            "reconstruction_command": "cat chunks/persian_tweets_part_*.csv > reconstructed_dataset.csv"
        }
        
        with open('chunks/metadata.json', 'w') as f:
            json.dump(metadata, f, indent=2)
        print("✅ Created metadata.json")
        
        # Create README
        readme_content = f"""# Persian Twitter Dataset Chunks

