name: Download and Push

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install requests
        run: pip install requests
      
      - name: Run dd.py
        run: python dd.py
      
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add biosig/ biosig-master/ 2>/dev/null || true
          git add .
          git commit -m "Add BIOSIG plugin folder" || echo "Nothing to commit"
          git push
