name: Download and Split ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Download and split
      run: |
        wget -O IV_2a_gdf.zip "http://www.bbci.de/competition/iv/download/IV_2a_gdf.zip"
        split -b 90m IV_2a_gdf.zip IV_2a_gdf.zip.part_
        
    - name: Commit and push
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add IV_2a_gdf.zip.part_*
        git commit -m "Add BNCI dataset zip parts (90MB each)" || echo "Nothing to commit"
        git push
