import os
import zipfile
from pathlib import Path

def extract_split_video(folder_path):
    """
    استخراج خودکار ویدیو از فایل‌های اسپلیت شده
    
    Args:
        folder_path: مسیر پوشه‌ای که فایل‌های part_*.zip توش هستن
    
    Returns:
        مسیر فایل ویدیوی نهایی
    """
    folder = Path(folder_path)
    
    # پیدا کردن فایل‌های part
    parts = sorted(folder.glob("part_*.zip"))
    
    if not parts:
        print("❌ فایل part_*.zip پیدا نشد!")
        return None
    
    print(f"🔍 پیدا شد {len(parts)} فایل part")
    
    # ترکیب کردن
    merged_path = folder / "merged.zip"
    with open(merged_path, 'wb') as outfile:
        for part in parts:
            print(f"  📦 خواندن: {part.name}")
            with open(part, 'rb') as infile:
                outfile.write(infile.read())
    
    print(f"✅ فایل‌ها ترکیب شدند: {merged_path}")
    
    # اکسترکت زیپ
    extract_folder = folder / "extracted"
    extract_folder.mkdir(exist_ok=True)
    
    with zipfile.ZipFile(merged_path, 'r') as zip_ref:
        zip_ref.extractall(extract_folder)
    
    print(f"✅ فایل زیپ اکسترکت شد به: {extract_folder}")
    
    # پیدا کردن فایل ویدیو
    video_files = list(extract_folder.glob("*.mp4"))
    if video_files:
        video_path = video_files[0]
        print(f"🎬 ویدیو پیدا شد: {video_path}")
        print(f"📏 حجم: {video_path.stat().st_size / (1024*1024):.2f} MB")
        return video_path
    
    print("⚠️ فایل mp4 پیدا نشد!")
    return None

