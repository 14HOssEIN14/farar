name: دریافت لینک تازه و دانلود ویدیو

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'لینک ویدیوی یوتیوب (مثل https://youtu.be/xxx)'
        required: true
        default: 'https://youtu.be/6Zy5VLcEbZc'
      quality:
        description: 'کیفیت (480/720)'
        required: true
        default: '720'

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: نصب yt-dlp
        run: |
          pip install --upgrade yt-dlp
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      
      - name: دریافت لینک تازه و دانلود
        run: |
          VIDEO_URL="${{ inputs.video_url }}"
          QUALITY="${{ inputs.quality }}"
          
          echo "🔍 در حال دریافت لینک تازه از یوتیوب..."
          
          # روش اول: تلاش با کلاینت های مختلف
          yt-dlp \
            --extractor-args "youtube:player_client=web,android" \
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            --geo-bypass \
            --geo-bypass-country US \
            -f "best[height<=$QUALITY]" \
            -o "video.%(ext)s" \
            "$VIDEO_URL" || \
          yt-dlp \
            --extractor-args "youtube:player_client=tv" \
            --user-agent "Mozilla/5.0 (ChromiumOS; CrOS aarch64 15944.31.0) AppleWebKit/537.36" \
            -f "best[height<=$QUALITY]" \
            -o "video.%(ext)s" \
            "$VIDEO_URL"
          
          echo "✅ ویدیو دانلود شد"
          ls -lh video.*
      
      - name: تغییر نام به .mp4 (در صورت نیاز)
        run: |
          if [ -f "video.webm" ]; then
            mv video.webm video.mp4
          elif [ -f "video.mkv" ]; then
            mv video.mkv video.mp4
          fi
          
          if [ -f "video.mp4" ]; then
            echo "✅ فایل نهایی: video.mp4"
            ls -lh video.mp4
          else
            echo "⚠️ فرمت فایل: $(ls video.* 2>/dev/null | head -1)"
          fi
      
      - name: آپلود به ریپازیتوری
        run: |
          mkdir -p downloaded_videos
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          
          # پیدا کردن فایل ویدیویی
          VIDEO_FILE=$(ls video.* 2>/dev/null | head -1)
          if [ -n "$VIDEO_FILE" ]; then
            cp "$VIDEO_FILE" "downloaded_videos/video_${TIMESTAMP}.mp4"
            
            git config user.name "github-actions[bot]"
            git config user.email "actions@github.com"
            git add downloaded_videos/
            git commit -m "Download video from ${{ inputs.video_url }}" || echo "Nothing to commit"
            git push
            
            echo "✅ فایل ذخیره شد: downloaded_videos/video_${TIMESTAMP}.mp4"
          else
            echo "❌ فایل ویدیویی پیدا نشد"
            exit 1
          fi
      
      - name: آپلود Artifact (پشتیبان)
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-video
          path: video.*
          retention-days: 30
