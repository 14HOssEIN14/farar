name: دانلود و آپلود مستقیم فایل از لینک googlevideo

on:
  workflow_dispatch:
    inputs:
      direct_url:
        description: 'لینک مستقیم googlevideo.com یا هر لینک مستقیم دیگر'
        required: true
        default: 'https://rr3---sn-nv47zne7.googlevideo.com/videoplayback?expire=1778110111&ei=P3r7acvZIfODp-oP2cniiQ8&ip=5.217.187.90&id=o-AGqgFx45xV71dyHs0dmgWWB2nRIBnYpFNbsxNx1-gUHa&itag=136'
      filename:
        description: 'نام فایل خروجی (مثلاً video.mp4)'
        required: true
        default: 'video.mp4'

jobs:
  download-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: دانلود فایل از لینک مستقیم
        run: |
          echo "📥 در حال دانلود از لینک..."
          echo "🔗 آدرس: ${{ inputs.direct_url }}"
          
          # دانلود فایل با wget
          wget --no-check-certificate \
               --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
               -O "${{ inputs.filename }}" \
               "${{ inputs.direct_url }}"
          
          echo "✅ دانلود کامل شد"
          ls -lh "${{ inputs.filename }}"
      
      - name: ایجاد پوشه و کپی فایل
        run: |
          mkdir -p downloaded_videos
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          
          # اضافه کردن timestamp به نام فایل
          BASENAME=$(basename "${{ inputs.filename }}" .mp4)
          NEWNAME="${BASENAME}_${TIMESTAMP}.mp4"
          
          cp "${{ inputs.filename }}" "downloaded_videos/$NEWNAME"
          echo "✅ فایل در downloaded_videos/$NEWNAME ذخیره شد"
          echo "new_filename=$NEWNAME" >> $GITHUB_OUTPUT
      
      - name: Commit و Push به ریپازیتوری
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add downloaded_videos/
          git commit -m "Add video file from direct link" || echo "Nothing to commit"
          git push
          
          echo "✅ فایل با موفقیت به ریپازیتوری推送 شد"
      
      - name: آپلود به عنوان Artifact (پشتیبان)
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-file
          path: ${{ inputs.filename }}
          retention-days: 30
