name: دانلود، زیپ، اسپلیت و آپلود به ریپازیتوری

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'لینک ویدیوی یوتیوب'
        required: true
      quality:
        description: 'کیفیت (480 یا 720)'
        required: true
        default: '720'

jobs:
  process:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install yt-dlp
        run: pip install yt-dlp
      
      - name: آماده‌سازی کوکی (از فایل یا Secret)
        run: |
          # اگر فایل cookies.txt وجود داره، استفاده کن
          # اگه نه، از Secret استفاده کن
          if [ -f "cookies.txt" ]; then
            echo "✅ کوکی از فایل cookies.txt بارگیری شد"
          elif [ -n "${{ secrets.YT_COOKIES }}" ]; then
            echo "${{ secrets.YT_COOKIES }}" > cookies.txt
            echo "✅ کوکی از Secret بارگیری شد"
          else
            echo "⚠️ هیچ کوکی‌ای پیدا نشد! شاید برای ویدیوهای عمومی بدون لاگین هم کار کنه"
          fi
      
      - name: دانلود ویدیو با کوکی (در صورت وجود)
        run: |
          # تلاش با کوکی اگه وجود داره
          if [ -f "cookies.txt" ]; then
            yt-dlp --cookies cookies.txt \
                   --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
                   --extractor-args "youtube:player_client=android,web" \
                   -f "best[height<=${{ inputs.quality }}]" \
                   -o "video.mp4" \
                   "${{ inputs.video_url }}"
          else
            # تلاش بدون کوکی
            yt-dlp --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
                   --extractor-args "youtube:player_client=android,web" \
                   -f "best[height<=${{ inputs.quality }}]" \
                   -o "video.mp4" \
                   "${{ inputs.video_url }}"
          fi
          
          echo "✅ ویدیو دانلود شد"
          ls -lh video.mp4
      
      - name: محاسبه حجم فایل
        id: size
        run: |
          SIZE=$(stat -c%s "video.mp4")
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "size_mb=$SIZE_MB" >> $GITHUB_OUTPUT
          echo "حجم فایل: $SIZE_MB MB"
      
      - name: زیپ کردن ویدیو
        run: |
          zip video.zip video.mp4
          echo "✅ ویدیو زیپ شد"
          ls -lh video.zip
      
      - name: بررسی حجم و تصمیم‌گیری
        id: decision
        run: |
          ZIP_SIZE=$(stat -c%s "video.zip")
          ZIP_MB=$((ZIP_SIZE / 1024 / 1024))
          echo "حجم فایل زیپ شده: $ZIP_MB MB"
          
          if [ $ZIP_MB -le 50 ]; then
            echo "📦 حجم کمتر از 50MB - فقط زیپ و آپلود مستقیم"
            echo "action=direct" >> $GITHUB_OUTPUT
            cp video.zip "video_$(date +%Y%m%d_%H%M%S).zip"
          else
            echo "✂️ حجم بیشتر از 50MB - نیاز به اسپلیت"
            echo "action=split" >> $GITHUB_OUTPUT
          fi
      
      - name: اسپلیت فایل زیپ به بخش‌های 50MB
        if: steps.decision.outputs.action == 'split'
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
          
          mkdir -p "chunks_$TIMESTAMP"
          cd "chunks_$TIMESTAMP"
          
          # اسپلیت فایل زیپ
          split -b 50M ../video.zip "part_" -a 2 --additional-suffix=".zip"
          
          # درست کردن فایل راهنما
          echo "این فایل‌ها بخش‌های یک فایل زیپ هستند." > README.txt
          echo "برای ترکیب کردن از دستور زیر استفاده کن:" >> README.txt
          echo "cat part_*.zip > merged.zip" >> README.txt
          echo "" >> README.txt
          echo "سپس با دستور unzip merged.zip فایل اصلی رو استخراج کن" >> README.txt
          echo "" >> README.txt
          echo "فایل اصلی: video.mp4" >> README.txt
          echo "لینک اصلی: ${{ inputs.video_url }}" >> README.txt
          
          cd ..
          
          echo "✅ فایل زیپ به بخش‌های زیر تقسیم شد:"
          ls -lh "chunks_$TIMESTAMP/"
      
      - name: آپلود به ریپازیتوری (حالت مستقیم)
        if: steps.decision.outputs.action == 'direct'
        run: |
          mkdir -p uploaded_videos
          cp video_*.zip uploaded_videos/
          echo "✅ فایل به پوشه uploaded_videos اضافه شد"
      
      - name: آپلود به ریپازیتوری (حالت اسپلیت)
        if: steps.decision.outputs.action == 'split'
        run: |
          TIMESTAMP="${{ steps.timestamp.outputs.timestamp }}"
          mkdir -p "split_files/$TIMESTAMP"
          cp -r "chunks_$TIMESTAMP"/* "split_files/$TIMESTAMP/"
          echo "✅ فایل‌های اسپلیت شده به پوشه split_files/$TIMESTAMP اضافه شدند"
      
      - name: Commit و Push به ریپازیتوری
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Add video from ${{ inputs.video_url }}" || echo "Nothing to commit"
          git push
