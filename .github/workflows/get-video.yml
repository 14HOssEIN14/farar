name: دانلود با Cobalt API (بدون خطا)

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'لینک ویدیوی یوتیوب'
        required: true
        default: 'https://youtu.be/6Zy5VLcEbZc'
      quality:
        description: 'کیفیت (480/720)'
        required: true
        default: '720'

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: نصب ابزارها
        run: |
          pip install requests
          sudo apt-get install -y jq
      
      - name: دریافت لینک مستقیم از Cobalt API
        id: cobalt
        run: |
          python3 << EOF
          import requests
          import json
          
          video_url = "${{ inputs.video_url }}"
          quality = "${{ inputs.quality }}"
          
          print(f"🔍 در حال ارسال درخواست به Cobalt API...")
          print(f"📹 ویدیو: {video_url}")
          print(f"🎯 کیفیت: {quality}p")
          
          response = requests.post(
              "https://api.cobalt.tools/api/json",
              json={
                  "url": video_url,
                  "vQuality": quality,
                  "vCodec": "h264",
                  "isAudioOnly": False,
                  "isTTFullAudio": False,
                  "isNoDither": True
              },
              headers={
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36",
                  "Accept": "application/json",
                  "Content-Type": "application/json"
              },
              timeout=60
          )
          
          if response.status_code == 200:
              data = response.json()
              status = data.get("status")
              
              if status == "redirect" and data.get("url"):
                  direct_url = data["url"]
                  print(f"\n✅ لینک مستقیم دریافت شد!")
                  print(f"🔗 {direct_url}")
                  
                  # ذخیره لینک در فایل
                  with open("direct_link.txt", "w") as f:
                      f.write(direct_url)
                  print(f"\n💾 لینک در فایل direct_link.txt ذخیره شد")
                  
              elif status == "error":
                  print(f"❌ خطای Cobalt: {data.get('text')}")
                  exit(1)
              else:
                  print(f"❌ پاسخ غیرمنتظره: {data}")
                  exit(1)
          else:
              print(f"❌ خطای اتصال به Cobalt: {response.status_code}")
              exit(1)
          EOF
      
      - name: دانلود ویدیو با لینک مستقیم
        run: |
          if [ -f "direct_link.txt" ]; then
            LINK=$(cat direct_link.txt)
            echo "📥 در حال دانلود ویدیو..."
            wget --no-check-certificate -O "video.mp4" "$LINK"
            echo "✅ ویدیو دانلود شد"
            ls -lh video.mp4
          else
            echo "❌ فایل لینک پیدا نشد"
            exit 1
          fi
      
      - name: زیپ و آپلود به ریپازیتوری
        run: |
          mkdir -p uploaded_videos
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          ZIP_NAME="video_${TIMESTAMP}.zip"
          
          zip "$ZIP_NAME" video.mp4
          cp "$ZIP_NAME" "uploaded_videos/"
          
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add uploaded_videos/
          git commit -m "Add video from ${{ inputs.video_url }}" || echo "Nothing to commit"
          git push
          
          echo "✅ فایل نهایی: uploaded_videos/$ZIP_NAME"
